# PeridotID deploy for the Antigane VPS.
#
# Conforms to the infra platform contract (infra/docs/application.md): joins the
# external `proxy` network, exposes internal ports only, owns its Traefik labels,
# healthchecks, stdout logging. No infra repo changes required.
#
# Domains (dual-serve since ANT-99/ANT-116 — old hosts stay live, never removed here):
#   main stack (up.sh main):
#     API    api.pid.peridotvault.com + api.peridot.id          → nest  :3301
#     wallet app.pid.peridotvault.com (+ peridot.id, frontend)  → nginx :3000
#     docs   Mintlify-hosted (docs.peridot.id) — no VPS service since ANT-124:
#            apps/docs is the Mintlify source (board user deploys manually).
#            The old pid.peridotvault.com docs container keeps running until the
#            next up.sh run removes it — sequence Mintlify-live BEFORE that.
#   test stack (up.sh test, ENV_SUFFIX=sandbox., NEW_API_HOST=sandbox-api.peridot.id):
#     API    api.sandbox.pid.peridotvault.com + sandbox-api.peridot.id → nest :3301
#     (wallet new host is frontend turf — ANT-117; DevOps DNS/TLS — ANT-118;
#      docs stay on the single Mintlify host docs.peridot.id (no sandbox docs host)
#
# main: cp deploy/.env.main.example deploy/.env.main && ./deploy/up.sh main
#
# ADR-0006: one VPS runs main + test behind a single Traefik; separation is by
# hostname (ENV_SUFFIX), router namespace, and compose project name (up.sh).

name: peridot-id

networks:
  proxy:
    external: true

# Cap json-file logs per container: without this stdout logging grows
# unbounded and can fill a small VPS disk between deploys.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    image: peridot-id-api${NAMESPACE}:${TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    networks: [proxy]
    expose: ["3301"]
    environment:
      NODE_ENV: production
      PORT: "3301"
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      API_URL: ${API_URL:-}
      # Deprecated cutover fallback (ANT-193): code reads API_DOMAIN only when
      # API_URL is unset. Set API_URL in Infisical; remove this once cut over.
      API_DOMAIN: ${API_DOMAIN:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      BREVO_API_KEY: ${BREVO_API_KEY}
      # COOKIE_SECURE derives from the API_URL protocol (https → true in every
      # deployed env). Override only for the http-API-behind-https-proxy edge.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Dual-serve (ANT-116): host-only cookies (no Domain attribute) are scoped to
      # the responding API host, so the SAME stack serves old (*.peridotvault.com)
      # and new (*.peridot.id) origins without a Domain suffix that browsers would
      # reject on the apex they don't belong to. A `Domain=.peridotvault.com` cookie
      # set from api.peridot.id is silently dropped — sessions would break there.
      # Pin per-env explicitly in Infisical /apps/api when cross-subdomain
      # visibility is ever needed; keep empty for dual-serve.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # ONE service-URL set (ANT-193): CORS, WebAuthn origins, wallet landing
      # URL, and cookie attributes derive from these. CLIENT_SUCCESS_URL stays
      # as a deprecated cutover fallback until Infisical carries WALLET_URL.
      WALLET_URL: ${WALLET_URL:-}
      CLIENT_SUCCESS_URL: ${CLIENT_SUCCESS_URL:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      DOCS_URL: ${DOCS_URL:-}
      # Additive CORS escape hatch (one-off edges; never required per env).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CLIENT_REDIRECT_ALLOWLIST: ${CLIENT_REDIRECT_ALLOWLIST}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-pid.peridotvault.com}
      # Explicit WebAuthn-origins edge only — derived from the service set otherwise.
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      PID_RELAYER_SECRET: ${PID_RELAYER_SECRET}
      PID_TREASURY_PUBKEY: ${PID_TREASURY_PUBKEY}
      DOKU_MODE: ${DOKU_MODE:-sandbox}
      DOKU_CLIENT_ID: ${DOKU_CLIENT_ID}
      DOKU_SECRET_KEY: ${DOKU_SECRET_KEY}
      DOKU_PRIVATE_KEY: ${DOKU_PRIVATE_KEY}
      DOKU_SAC_TYPE: ${DOKU_SAC_TYPE:-DEFAULT}
      DOKU_USERS_PARENT_PROFILE_ID: ${DOKU_USERS_PARENT_PROFILE_ID}
      DOKU_TREASURY_PROFILE_ID: ${DOKU_TREASURY_PROFILE_ID}
      DOKU_TREASURY_ACCOUNT_NO: ${DOKU_TREASURY_ACCOUNT_NO}
      DOKU_SYSTEM_POINT_ACCOUNT_NO: ${DOKU_SYSTEM_POINT_ACCOUNT_NO}
      DOKU_TREASURY_POINT_ACCOUNT_NO: ${DOKU_TREASURY_POINT_ACCOUNT_NO}
      PID_REDEMPTION_ENABLED: ${PID_REDEMPTION_ENABLED:-false}
      PID_FIAT_LEDGER_ENABLED: ${PID_FIAT_LEDGER_ENABLED:-true}
      PID_FIAT_LEDGER_FROZEN: ${PID_FIAT_LEDGER_FROZEN:-false}
      PID_FIAT_LEDGER_TREASURY_PID: ${PID_FIAT_LEDGER_TREASURY_PID:-}
      PID_BOOTSTRAP_ADMIN_PID: ${PID_BOOTSTRAP_ADMIN_PID:-}
      DOKU_WEBHOOK_URL: ${DOKU_WEBHOOK_URL}
      DOKU_CHECKOUT_NOTIFY_URL: ${DOKU_CHECKOUT_NOTIFY_URL:-${DOKU_WEBHOOK_URL}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3301/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      # Dual-serve (ANT-116): old host stays first (existing integrations unaffected);
      # NEW_API_HOST (up.sh: api.peridot.id / sandbox-api.peridot.id) serves alongside.
      - "traefik.http.routers.pid-api${NAMESPACE}.rule=Host(`api.${ENV_SUFFIX}pid.peridotvault.com`) || Host(`${NEW_API_HOST:-api.peridot.id}`)"
      - "traefik.http.routers.pid-api${NAMESPACE}.entrypoints=websecure"
      - "traefik.http.routers.pid-api${NAMESPACE}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pid-api${NAMESPACE}.middlewares=security-headers@file"
      - "traefik.http.services.pid-api${NAMESPACE}.loadbalancer.server.port=3301"

  # Cutover redirect (ANT-136/ANT-137, board order 2026-10-19): old docs URLs
  # pid.peridotvault.com/docs* 301 → Mintlify host (NEW_DOCS_HOST).
  # No VPS docs image to run — the redirect middleware answers before any
  # backend is hit, so the router reuses the existing app service as its
  # backend (zero new images, zero new ports). Next up.sh --remove-orphans
  # drops the stale pre-migration docs container; this router is what keeps
  # old links alive afterwards. Sequencing: run up.sh only after Mintlify
  # serves docs.peridot.id (single docs host for both stacks).

  app:
    build:
      context: ..
      dockerfile: Dockerfile.app
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: peridot-id-app${NAMESPACE}:${TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    networks: [proxy]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # Dual-serve (ANT-118): wallet keeps the old app.* host and additionally
      # answers on the apex (NEW_WALLET_HOST: peridot.id / sandbox.peridot.id).
      # Same nginx build serves both — no redirect chain, old links keep working.
      - "traefik.http.routers.app${NAMESPACE}.rule=Host(`app.${ENV_SUFFIX}pid.peridotvault.com`) || Host(`${NEW_WALLET_HOST:-peridot.id}`)"
      - "traefik.http.routers.app${NAMESPACE}.entrypoints=websecure"
      - "traefik.http.routers.app${NAMESPACE}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app${NAMESPACE}.middlewares=security-headers@file"
      - "traefik.http.services.app${NAMESPACE}.loadbalancer.server.port=3000"
      # Cutover redirect ANT-137: old docs path → Mintlify. Router matches only
      # the old apex + /docs prefix; redirect middleware answers 301 before the
      # app backend is ever hit (backend is a formality — Traefik requires one).
      # Order matters: api-specific rule first, generic strip second.
      # Blast radius: old apex /docs* only; wallet/API/dashboard routers untouched.
      # Rollback: `git revert` this block + `./deploy/up.sh <env>` restores
      # pre-cutover routing (old container gone → /docs 404s instead).
      - "traefik.http.routers.pid-docs${NAMESPACE}.rule=Host(`${ENV_SUFFIX}pid.peridotvault.com`) && PathPrefix(`/docs`)"
      - "traefik.http.routers.pid-docs${NAMESPACE}.priority=100"
      - "traefik.http.routers.pid-docs${NAMESPACE}.entrypoints=websecure"
      - "traefik.http.routers.pid-docs${NAMESPACE}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pid-docs${NAMESPACE}.middlewares=security-headers@file,pid-docs-api-redirect${NAMESPACE}@docker,pid-docs-redirect${NAMESPACE}@docker"
      # /docs/api* → /api/overview (Mintlify page moved; plain prefix-strip would 404).
      - "traefik.http.middlewares.pid-docs-api-redirect${NAMESPACE}.redirectregex.regex=^https://[^/]+/docs/api(?:/(.*))?"
      - "traefik.http.middlewares.pid-docs-api-redirect${NAMESPACE}.redirectregex.replacement=https://${NEW_DOCS_HOST:-docs.peridot.id}/api/overview"
      - "traefik.http.middlewares.pid-docs-api-redirect${NAMESPACE}.redirectregex.permanent=true"
      # /docs → / and /docs/<sub> → /<sub> (strip prefix, preserve sub-path).
      - "traefik.http.middlewares.pid-docs-redirect${NAMESPACE}.redirectregex.regex=^https://[^/]+/docs(?:/(.*))?"
      - "traefik.http.middlewares.pid-docs-redirect${NAMESPACE}.redirectregex.replacement=https://${NEW_DOCS_HOST:-docs.peridot.id}/$${1}"
      - "traefik.http.middlewares.pid-docs-redirect${NAMESPACE}.redirectregex.permanent=true"

  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile.dashboard
      args:
        VITE_API_URL: ${DASHBOARD_API_URL}
        VITE_POPUP_URL: ${DASHBOARD_POPUP_URL}
        VITE_PID_ENV: ${DASHBOARD_PID_ENV}
        VITE_PID_CLIENT_ID: ${DASHBOARD_PID_CLIENT_ID:-}
        VITE_OTHER_WORKSPACE_URL: ${DASHBOARD_OTHER_WORKSPACE_URL:-}
    image: peridot-id-dashboard${NAMESPACE}:${TAG:-latest}
    restart: unless-stopped
    networks: [proxy]
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # New host only (ANT-118): the dashboard never lived on an old host of its
      # own (it was /workspace inside docs, still served there). No old rule to keep.
      - "traefik.http.routers.pid-dashboard${NAMESPACE}.rule=Host(`${NEW_DASHBOARD_HOST:-dashboard.peridot.id}`)"
      - "traefik.http.routers.pid-dashboard${NAMESPACE}.entrypoints=websecure"
      - "traefik.http.routers.pid-dashboard${NAMESPACE}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pid-dashboard${NAMESPACE}.middlewares=security-headers@file"
      - "traefik.http.services.pid-dashboard${NAMESPACE}.loadbalancer.server.port=3001"