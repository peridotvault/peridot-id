# PeridotID deploy for the Antigane VPS.
#
# Conforms to the infra platform contract (infra/docs/application.md): joins the
# external `proxy` network, exposes internal ports only, owns its Traefik labels,
# healthchecks, stdout logging. No infra repo changes required.
#
# Domains (peridot.id hard cutover — ANT-400/ANT-405, single canonical host per service):
#   main stack (up.sh main):
#     API       api.peridot.id                 → nest  :3301
#     wallet    peridot.id                     → nginx :3000
#     dashboard dashboard.peridot.id           → nginx :3001
#     docs      Mintlify-hosted (docs.peridot.id) — no VPS service since ANT-124:
#               apps/docs is the Mintlify source (board user deploys manually).
#   test stack (up.sh test, NEW_API_HOST=sandbox-api.peridot.id):
#     API       sandbox-api.peridot.id         → nest  :3301
#     wallet    sandbox.peridot.id             → nginx :3000
#     dashboard sandbox-dashboard.peridot.id   → nginx :3001
#     docs      single Mintlify host docs.peridot.id (no sandbox docs host)
#
# main: cp deploy/.env.main.example deploy/.env.main && ./deploy/up.sh main
#
# ADR-0006: one VPS runs main + test behind a single Traefik; separation is by
# hostname (NEW_*_HOST vars), router namespace, and compose project name (up.sh).

name: peridot-id

networks:
  proxy:
    external: true

# Cap json-file logs per container: without this stdout logging grows
# unbounded and can fill a small VPS disk between deploys.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
      # ANT-385: baked into the image as ENV GIT_SHA, reported by /v1/health.
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: peridot-id-api${NAMESPACE}:${TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    # ANT-347 LOW-4: bound memory + drop all caps (least privilege).
    mem_limit: 768m
    mem_reservation: 384m
    cap_drop: [ALL]
    networks: [proxy]
    expose: ["3301"]
    environment:
      NODE_ENV: production
      PORT: "3301"
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      EMAIL_OTP_PEPPER: ${EMAIL_OTP_PEPPER:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      API_URL: ${API_URL:-}
      # Deprecated cutover fallback (ANT-193): code reads API_DOMAIN only when
      # API_URL is unset. Set API_URL in Infisical; remove this once cut over.
      API_DOMAIN: ${API_DOMAIN:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      BREVO_API_KEY: ${BREVO_API_KEY}
      # COOKIE_SECURE derives from the API_URL protocol (https → true in every
      # deployed env). Override only for the http-API-behind-https-proxy edge.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Host-only cookies (no Domain attribute) are scoped to the responding API
      # host. A `Domain=` suffix set from a host it doesn't belong to is silently
      # dropped by browsers — sessions would break there. Pin per-env explicitly
      # in Infisical /apps/api only when cross-subdomain visibility is ever
      # needed; keep empty otherwise.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # ONE service-URL set (ANT-193): CORS, WebAuthn origins, wallet landing
      # URL, and cookie attributes derive from these. CLIENT_SUCCESS_URL stays
      # as a deprecated cutover fallback until Infisical carries WALLET_URL.
      WALLET_URL: ${WALLET_URL:-}
      CLIENT_SUCCESS_URL: ${CLIENT_SUCCESS_URL:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      DOCS_URL: ${DOCS_URL:-}
      # Additive CORS escape hatch (one-off edges; never required per env).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CLIENT_REDIRECT_ALLOWLIST: ${CLIENT_REDIRECT_ALLOWLIST}
      # WebAuthn RP ID derives from the wallet host by default (generic —
      # no per-env pin). Pin explicitly only for passkey continuity when
      # rotating domains with existing credentials.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      RELAYER_SVM_SECRET_KEY: ${RELAYER_SVM_SECRET_KEY}
      DOKU_MODE: ${DOKU_MODE:-sandbox}
      DOKU_CLIENT_ID: ${DOKU_CLIENT_ID}
      DOKU_SECRET_KEY: ${DOKU_SECRET_KEY}
      DOKU_PRIVATE_KEY: ${DOKU_PRIVATE_KEY}
      DOKU_SAC_TYPE: ${DOKU_SAC_TYPE:-DEFAULT}
      DOKU_USERS_PARENT_PROFILE_ID: ${DOKU_USERS_PARENT_PROFILE_ID}
      DOKU_TREASURY_PROFILE_ID: ${DOKU_TREASURY_PROFILE_ID}
      DOKU_TREASURY_ACCOUNT_NO: ${DOKU_TREASURY_ACCOUNT_NO}
      DOKU_SYSTEM_POINT_ACCOUNT_NO: ${DOKU_SYSTEM_POINT_ACCOUNT_NO}
      DOKU_TREASURY_POINT_ACCOUNT_NO: ${DOKU_TREASURY_POINT_ACCOUNT_NO}
      PID_REDEMPTION_ENABLED: ${PID_REDEMPTION_ENABLED:-false}
      PID_FIAT_LEDGER_ENABLED: ${PID_FIAT_LEDGER_ENABLED:-true}
      PID_FIAT_LEDGER_FROZEN: ${PID_FIAT_LEDGER_FROZEN:-false}
      PID_FIAT_LEDGER_TREASURY_PID: ${PID_FIAT_LEDGER_TREASURY_PID:-}
      # Sandbox faucet gate (ANT-287 FR-2, DevOps ANT-290): when "true" the API
      # registers POST /v1/fiat/test-credit (instant test-money, ledger-only).
      # Fail-closed default: unset/anything-but-"true" ⇒ route absent (prod
      # returns 404 with zero ledger writes). Sandbox deploy sets true
      # (deploy/.env.test.example + Infisical test env); production sets false
      # explicitly. Backend contract: faucet mints MUST write
      # fiat_ledger_entries with kind='fiat_issue' and source='faucet' so the
      # faucet-abuse alert (deploy/alerts/) can count them.
      PID_FAUCET_ENABLED: ${PID_FAUCET_ENABLED:-false}
      # XP & Leveling M3 migration gate (ANT-89, board-approved): exact-"true"
      # match, fail-closed in code — unset or anything-but-"true" ⇒ migration
      # 503 with zero ledger writes. Intake itself is NOT env-gated; only the
      # xp.suspend.* DB kill-switches can stop awarding. Secrets injected at
      # runtime via Infisical /apps/api (never baked into the image); these
      # lines are only the container passthrough.
      PID_XP_MIGRATION_ENABLED: ${PID_XP_MIGRATION_ENABLED:-false}
      PID_BOOTSTRAP_ADMIN_PID: ${PID_BOOTSTRAP_ADMIN_PID:-}
      DOKU_WEBHOOK_URL: ${DOKU_WEBHOOK_URL}
      DOKU_CHECKOUT_NOTIFY_URL: ${DOKU_CHECKOUT_NOTIFY_URL:-${DOKU_WEBHOOK_URL}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3301/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      # Canonical host only (ANT-405 hard cutover):
      # NEW_API_HOST (up.sh: api.peridot.id / sandbox-api.peridot.id).
      - "traefik.http.routers.pid-api${NAMESPACE}.rule=Host(`${NEW_API_HOST:-api.peridot.id}`)"
      - "traefik.http.routers.pid-api${NAMESPACE}.entrypoints=websecure"
      - "traefik.http.routers.pid-api${NAMESPACE}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pid-api${NAMESPACE}.middlewares=security-headers@file"
      - "traefik.http.services.pid-api${NAMESPACE}.loadbalancer.server.port=3301"

  app:
    build:
      context: ..
      dockerfile: Dockerfile.app
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: peridot-id-app${NAMESPACE}:${TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    # ANT-347 LOW-4: bound memory + drop all caps (least privilege).
    mem_limit: 256m
    mem_reservation: 128m
    cap_drop: [ALL]
    networks: [proxy]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # Canonical wallet host only (ANT-405 hard cutover):
      # NEW_WALLET_HOST (up.sh: peridot.id / sandbox.peridot.id).
      - "traefik.http.routers.app${NAMESPACE}.rule=Host(`${NEW_WALLET_HOST:-peridot.id}`)"
      - "traefik.http.routers.app${NAMESPACE}.entrypoints=websecure"
      - "traefik.http.routers.app${NAMESPACE}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app${NAMESPACE}.middlewares=security-headers@file"
      - "traefik.http.services.app${NAMESPACE}.loadbalancer.server.port=3000"

  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile.dashboard
      args:
        VITE_API_URL: ${DASHBOARD_API_URL}
        VITE_POPUP_URL: ${DASHBOARD_POPUP_URL}
        VITE_PID_ENV: ${DASHBOARD_PID_ENV}
        VITE_PID_CLIENT_ID: ${DASHBOARD_PID_CLIENT_ID:-}
        VITE_OTHER_WORKSPACE_URL: ${DASHBOARD_OTHER_WORKSPACE_URL:-}
    image: peridot-id-dashboard${NAMESPACE}:${TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    # ANT-347 LOW-4: bound memory + drop all caps (least privilege).
    mem_limit: 256m
    mem_reservation: 128m
    cap_drop: [ALL]
    networks: [proxy]
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # New host only (ANT-118): the dashboard never lived on an old host of its
      # own (it was /workspace inside docs, still served there). No old rule to keep.
      - "traefik.http.routers.pid-dashboard${NAMESPACE}.rule=Host(`${NEW_DASHBOARD_HOST:-dashboard.peridot.id}`)"
      - "traefik.http.routers.pid-dashboard${NAMESPACE}.entrypoints=websecure"
      - "traefik.http.routers.pid-dashboard${NAMESPACE}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pid-dashboard${NAMESPACE}.middlewares=security-headers@file"
      - "traefik.http.services.pid-dashboard${NAMESPACE}.loadbalancer.server.port=3001"