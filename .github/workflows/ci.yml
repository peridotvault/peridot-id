name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  svm-program-id:
    # ANT-215 (Tobias ANT-212 Finding 3): a typo'd PID_PROGRAM_ID that still
    # base58-decodes to 32 bytes builds green and bricks at runtime
    # (IncorrectProgramId). This job pins the guard that deploy jobs run
    # before cargo build-sbf: contracts/svm/assert-program-id.sh equality
    # against the cluster deploy keypair, plus the build.rs hard error when
    # PID_PROGRAM_ID is unset for testnet/mainnet builds. Hermetic on purpose
    # (bash + python3 stdlib only, no Solana toolchain) so it stays fast and
    # never flakes on toolchain downloads. Blast radius: this job only —
    # it builds nothing and cannot break the TS/EVM jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Program-ID deploy guard
        run: |
          GUARD=contracts/svm/assert-program-id.sh
          LOCAL_ID="CiwLJ1hMNjSRdZj2yMVt9BseRTjVd4pjz7Mxr9yXf6NT"
          TESTNET_ID="D6TpM7caN3tG31Trq6cffKKnWbS4pP7nWJJbd2ALVsg3"
          bash -n "$GUARD"
          test -x "$GUARD"

          # 1. Canonical IDs pass the length-only check (sanity).
          PID_PROGRAM_ID="$LOCAL_ID" "$GUARD"
          PID_PROGRAM_ID="$TESTNET_ID" "$GUARD"

          # 2. Equality path: exact match succeeds with --require-explicit.
          PID_PROGRAM_ID="$TESTNET_ID" "$GUARD" --expected "$TESTNET_ID" --require-explicit

          # 3. Finding-3 trap: single-char typo still decodes to 32 bytes, so
          #    the length-only check passes — but equality MUST fail. This is
          #    why deploy jobs pass --keypair instead of relying on build.rs.
          TYPO="${TESTNET_ID%3}4"
          PID_PROGRAM_ID="$TYPO" "$GUARD"  # length-only: passes (the trap)
          if PID_PROGRAM_ID="$TYPO" "$GUARD" --expected "$TESTNET_ID"; then
            echo "::error::guard missed a typo'd PID_PROGRAM_ID — equality check broken"
            exit 1
          fi

          # 4. Malformed input fails closed.
          if PID_PROGRAM_ID='!!!not-base58!!!' "$GUARD"; then
            echo "::error::guard accepted malformed PID_PROGRAM_ID"
            exit 1
          fi

          # 5. Unset + --require-explicit is a hard error (testnet deploy jobs).
          if env -u PID_PROGRAM_ID "$GUARD" --require-explicit; then
            echo "::error::guard allowed unset PID_PROGRAM_ID under --require-explicit"
            exit 1
          fi
          # Without the flag, unset stays a warning (local/devnet default).
          env -u PID_PROGRAM_ID "$GUARD"

          # 6. build.rs keeps the matching build-time gate so the two cannot
          #    drift apart: PID_PROGRAM_ID_REQUIRED=1 / SOLANA_CLUSTER=testnet*
          #    makes an unset PID_PROGRAM_ID a compile error, not a default.
          #    (plain grep: this job installs nothing, so no ripgrep on runner.)
          grep -q 'PID_PROGRAM_ID_REQUIRED' contracts/svm/smart-account/build.rs
          grep -q 'SOLANA_CLUSTER' contracts/svm/smart-account/build.rs

          echo "svm-program-id guard: all assertions held"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Prisma generate
        run: pnpm --filter @peridotvault/pid-api db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Dashboard build + typecheck (@peridotvault/pid-dashboard)
        run: |
          # ANT-83 NFR: build + typecheck cover the dashboard package from day one.
          # Root `pnpm -r` recursion covers it automatically once added; this step makes
          # the coverage explicit and fails loudly if the package ever drops its scripts.
          if [ -d apps/dashboard ]; then
            pnpm --filter @peridotvault/pid-dashboard typecheck
            pnpm --filter @peridotvault/pid-dashboard build
          else
            echo "apps/dashboard not present yet — covered by pnpm -r recursion once added"
          fi

      - name: Login split guard
        run: |
          # First-party wallet must never use the popup / hosted flow (third-party only).
          # Docs (*.md) may name it — only code is checked. window.opener (answering
          # a popup) is fine; window.open (opening one) is banned. Exception: the
          # embed module (src/feat/embed/**) runs the wallet in a THIRD-PARTY iframe,
          # where delegating writes to the popup is exactly the required flow.
          if rg -n 'popupBaseUrl|openLoginPopup|HOSTED_LOGIN_URL|PROD_BASE_URL|window\.open\b' apps/wallet --glob '!*.md' --glob '!apps/wallet/src/feat/embed/**'; then
            echo "::error::apps/wallet must not use the popup/hosted flow — see apps/wallet README"
            exit 1
          fi
          # Canonical prod host is api.pid.peridotvault.com (Vercel peridot-id hosts retired).
          if rg -n 'peridot-id\.peridotvault\.com' --glob '!node_modules/**' .; then
            echo "::error::retired peridot-id.peridotvault.com host referenced"
            exit 1
          fi

      - name: Points issuance guard
        run: |
          # Spendable points must ONLY be issued inside FiatSubAccountService
          # after server-side DOKU corroboration. No SDK method or wallet
          # screen may issue/mint/credit points or touch the top-up/void
          # primitives — user input creates invoices, never credits. The only
          # sanctioned entry is the admin-guarded clawback route, which calls
          # the service (never DOKU directly). Docs (*.md) may name them.
          if rg -n 'issuePointsForDeposit|issueForDeposit|executePointTopup|clawbackPoints|topupVoid|DOKU_NON_FIAT' apps/wallet packages/sdk-js --glob '!*.md'; then
            echo "::error::points issuance outside FiatSubAccountService corroborated paths — see docs/prds/PRD_v6.md §3"
            exit 1
          fi
          if rg -n 'issuePointsForDeposit|executePointTopup|topupVoid|DOKU_NON_FIAT' apps/api/src/fiat/fiat.controller.ts; then
            echo "::error::controller must never issue points directly — see docs/prds/PRD_v6.md §3"
            exit 1
          fi
          if rg -n 'issueForDeposit' apps/api/src/fiat/fiat-ledger.controller.ts; then
            echo "::error::ledger controller must never issue directly — issuance runs only inside FiatLedgerService after corroboration, see docs/FIAT_LEDGER.md"
            exit 1
          fi

      - name: Fiat popup approval guard
        run: |
          # Every third-party fiat write ceremony must exist on BOTH sides:
          # the SDK delegation (fiat-client routes viaPopup) and the host
          # approval path (useFiatPrepare builds the server-quoted summary and
          # executes the action). A dangling action string means approvals
          # silently never happen.
          for action in fiat-checkout fiat-transfer; do
            if ! rg -q "viaPopup.*\"$action\"" packages/sdk-js/src/fiat/fiat-client.ts; then
              echo "::error::SDK missing viaPopup delegation for $action"
              exit 1
            fi
            if ! rg -q "\"$action\"" apps/wallet/src/feat/fiat/hooks/useFiatPrepare.ts; then
              echo "::error::useFiatPrepare missing handler for $action"
              exit 1
            fi
          done

      - name: Import boundaries guard
        run: |
          # ADR 007 §8: only pid-core (primitives) and pid-solana (chain adapter) may
          # import @solana/web3.js. Everything else goes through their surfaces.
          if rg -n "from ['\"]@solana/web3\\.js['\"]" packages apps --glob '!packages/core/**' --glob '!packages/solana/src/**' --glob '!**/*.e2e.mjs' --glob '!node_modules/**'; then
            echo "::error::@solana/web3.js imported outside pid-core/pid-solana"
            exit 1
          fi

      - name: Delegatecall ban guard
        run: |
          # V4_PERMISSIONS.md: no delegatecall anywhere in first-party account code
          # (contracts/evm/src only — vendored lib/ and prose comments excluded).
          # Prose may name it; only actual usage `delegatecall(` fails the build.
          if rg -n 'delegatecall\(' contracts/evm/src/; then
            echo "::error::delegatecall usage in contracts/evm/src — permanently prohibited, see contracts/V4_PERMISSIONS.md"
            exit 1
          fi

      - name: Foundry tests
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Forge test
        run: forge test --root contracts/evm

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
