name: Deploy

on:
  push:
    branches: [main, test]
  # Manual deploy: pick the ref (main → production, test → sandbox).
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter @peridotvault/pid-api db:generate
      - name: Typecheck
        run: pnpm typecheck

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: [typecheck]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: true
    steps:
      - name: Deploy to prod VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          command_timeout: 60m
          # Default is false: a failed command would be ignored and the job
          # would still report success (that shipped a stale tree for days).
          script_stop: true
          script: |
            set -euo pipefail
            # Fetch over HTTPS: origin is already https and the repo is public,
            # so the VPS needs no GitHub deploy key and no github.com entry in
            # known_hosts. A missing host key used to break `git fetch` while
            # the deploy kept going against the old checkout.
            cd /opt/apps/peridot-id/peridot-id
            git fetch origin main
            git reset --hard FETCH_HEAD
            git checkout -B main FETCH_HEAD
            # Never deploy a stale tree: prove the checkout is this commit.
            test "$(git rev-parse HEAD)" = "${{ github.sha }}" || {
              echo "::error::checkout is $(git rev-parse HEAD), expected ${{ github.sha }}"
              exit 1
            }
            # Disk guard: a full disk kills the image export mid-build (seen on
            # sandbox). Running images are never pruned — only build cache and
            # superseded tags go.
            avail_kb=$(df --output=avail -k /var/lib/docker 2>/dev/null | tail -1 | tr -dc '0-9')
            [ -z "$avail_kb" ] && avail_kb=$(df --output=avail -k / | tail -1 | tr -dc '0-9')
            if [ "${avail_kb:-0}" -lt 8388608 ]; then
              echo "low disk (${avail_kb}KB free) — pruning builder cache and unused images"
              docker builder prune -af || true
              docker image prune -af || true
            fi
            ./deploy/up.sh main

  deploy-test:
    if: github.ref == 'refs/heads/test'
    needs: [typecheck]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test
      cancel-in-progress: true
    steps:
      - name: Deploy sandbox stack (separate sandbox VPS)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SANDBOX_VPS_HOST }}
          username: ${{ secrets.SANDBOX_VPS_USER }}
          # ANT-385 (board decision fa6cd23b 2026-10-21): password auth
          # restored — SANDBOX_VPS_SSH_KEY was never provisioned after the
          # ANT-347 key-auth switch, breaking every test deploy at SSH
          # connect. Follow-up: re-harden to key-auth once a deploy keypair
          # is installed on the sandbox VPS.
          password: ${{ secrets.SANDBOX_VPS_PASSWORD }}
          command_timeout: 60m
          # Default is false: a failed command would be ignored and the job
          # would still report success (that shipped a stale tree for days).
          script_stop: true
          script: |
            set -euo pipefail
            # Dedicated sandbox host + clone. Uses deploy/.env.test
            # (DOKU sandbox — no real money ever moves here).
            cd /opt/apps/peridot-id/peridot-id-test
            git fetch origin test
            git reset --hard FETCH_HEAD
            git checkout -B test FETCH_HEAD
            # Never deploy a stale tree: prove the checkout is this commit.
            test "$(git rev-parse HEAD)" = "${{ github.sha }}" || {
              echo "::error::checkout is $(git rev-parse HEAD), expected ${{ github.sha }}"
              exit 1
            }
            # Disk guard: a full disk kills the image export mid-build (seen on
            # sandbox). Running images are never pruned — only build cache and
            # superseded tags go.
            avail_kb=$(df --output=avail -k /var/lib/docker 2>/dev/null | tail -1 | tr -dc '0-9')
            [ -z "$avail_kb" ] && avail_kb=$(df --output=avail -k / | tail -1 | tr -dc '0-9')
            if [ "${avail_kb:-0}" -lt 8388608 ]; then
              echo "low disk (${avail_kb}KB free) — pruning builder cache and unused images"
              docker builder prune -af || true
              docker image prune -af || true
            fi
            ./deploy/up.sh test