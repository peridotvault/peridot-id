name: Publish packages

# Publishes the public npm packages on a version tag (e.g. `v1.0.0`) or manual
# dispatch. Requires an NPM_TOKEN repo secret with publish access to the
# @peridotvault scope. Leaves first: pid-types → pid-core → pid-solana →
# pid-payments → pid-sdk-js. Packages already at their current version on the
# registry are skipped, so a dispatch is safe when only some were bumped.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @peridotvault/pid-types --filter @peridotvault/pid-core --filter @peridotvault/pid-payments --filter @peridotvault/pid-solana --filter @peridotvault/pid-sdk-js build

      - name: Publish (leaves first)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in \
            @peridotvault/pid-types \
            @peridotvault/pid-core \
            @peridotvault/pid-solana \
            @peridotvault/pid-payments \
            @peridotvault/pid-sdk-js; do
            ver=$(pnpm --filter "$pkg" exec node -e "process.stdout.write(require('./package.json').version)")
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "skip $pkg@$ver (already published)"
              continue
            fi
            echo "publishing $pkg@$ver"
            pnpm --filter "$pkg" publish --access public --no-git-checks || {
              echo "publish failed for $pkg@$ver"; exit 1; }
          done
