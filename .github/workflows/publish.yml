name: Publish packages

# Publishes the public npm packages on a version tag (e.g. `v1.10.0`) or manual
# dispatch. Requires an NPM_TOKEN repo secret with publish access to the
# @peridotvault scope. Leaves first: pid-types → pid-core → pid-solana →
# pid-payments → pid-evm → pid-sdk-js → pid-react-embed. Packages already at
# their current version on the registry are skipped, so a dispatch is safe
# when only some were bumped.
#
# Release discipline: bump the versions, then push a tag `v<version of the
# flagship pid-sdk-js release>`; one tag releases every bumped package, so a
# published version always maps back to a commit. Published packages carry an
# npm provenance attestation (sigstore, built from this workflow).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @peridotvault/pid-types --filter @peridotvault/pid-core --filter @peridotvault/pid-payments --filter @peridotvault/pid-solana --filter @peridotvault/pid-evm --filter @peridotvault/pid-sdk-js --filter @peridotvault/pid-react-embed build

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (leaves first)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in \
            @peridotvault/pid-types \
            @peridotvault/pid-core \
            @peridotvault/pid-solana \
            @peridotvault/pid-payments \
            @peridotvault/pid-evm \
            @peridotvault/pid-sdk-js \
            @peridotvault/pid-react-embed; do
            ver=$(pnpm --filter "$pkg" exec node -e "process.stdout.write(require('./package.json').version)")
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "skip $pkg@$ver (already published)"
              continue
            fi
            echo "publishing $pkg@$ver"
            # Guard: the tarball must carry real version pins, never pnpm's
            # `workspace:` protocol. `npm publish` leaves it in (uninstallable:
            # EUNSUPPORTEDPROTOCOL), `pnpm publish` rewrites it.
            packdir=$(mktemp -d)
            pnpm --filter "$pkg" pack --pack-destination "$packdir" >/dev/null
            tarball=$(ls "$packdir"/*.tgz | head -1)
            if tar -xzOf "$tarball" package/package.json | grep -q 'workspace:'; then
              echo "::error::$pkg@$ver still declares workspace: dependencies — publish through pnpm, never npm publish"
              exit 1
            fi
            rm -rf "$packdir"
            pnpm --filter "$pkg" publish --access public --no-git-checks --provenance || {
              echo "publish failed for $pkg@$ver"; exit 1; }
            # A 2FA-staged publish "succeeds" but never reaches the registry, so
            # verify the version is actually live (registry propagation lags a
            # few seconds). Without this, a token lacking "bypass 2FA" fails
            # silently and the tag looks green.
            for _ in 1 2 3 4 5 6; do
              npm view "$pkg@$ver" version >/dev/null 2>&1 && break
              sleep 5
            done
            if ! npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "::error::$pkg@$ver is not on the registry after publish — staged for 2FA? The token needs 'bypass 2FA' for automation."
              exit 1
            fi
          done
