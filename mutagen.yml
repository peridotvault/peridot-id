# mutagen project start
# mutagen project list
# mutagen project terminate
# mutagen sync list           # Status: Watching for changes (not "Connecting")

# # Mac → PC
# touch sync-test-mac && ssh ifal@192.168.100.145 "ls /home/ifal/workspace/business/antigane/peridot/peridot-id/sync-test-mac"
# # PC → Mac
# ssh ifal@192.168.100.145 "touch /home/ifal/workspace/business/antigane/peridot/peridot-id/sync-test-pc"; ls sync-test-pc
# # cleanup both sides
# rm sync-test-mac sync-test-pc; ssh ifal@192.168.100.145 "rm /home/ifal/workspace/business/antigane/peridot/peridot-id/sync-test-pc"

sync:
  defaults:
    mode: two-way-resolved
    ignore:
      vcs: true
      paths:
        - node_modules
        - "**/node_modules"
        - .next
        - "**/.next"
        - dist
        - "**/dist"
        - build
        - "**/build"
        - target
        - "**/target"
        - .turbo
        - "**/.turbo"
        - coverage
        - "**/coverage"
        - "*.log"
        - ".DS_Store"
        - graphify-out
        - "**/graphify-out"
        # peridot-id specific (build artifacts / local-only state)
        # NOTE: .env SENGAJA ikut di-sync sesuai permintaan (jangan tambah ignore .env* di sini)
        - test-ledger
        - "**/test-ledger"
        - "*.rdb"
        - "*.tsbuildinfo"
        - "**/*.tsbuildinfo"
        - .expo
        - "**/.expo"
        - apps/api/test/.proof-out
        - mutagen.yml.lock
    permissions:
      defaultFileMode: 0644
      defaultDirectoryMode: 0755

  peridot-id:
    alpha: /Users/ranaufal/MyWork/Business/__AntiganeInc__/PeridotID/peridot-id
    beta: ifal@192.168.100.145:/home/ifal/workspace/business/antigane/peridot/peridot-id
    flushOnCreate: true
