[package]
name = "peridot-mock-forwarder"
version = "0.1.0"
description = "Adversarial test helper: forwards received accounts (with their signer bits) to a third program"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Same pinned line as the smart-account program (MSRV 1.84, solana 2.3.x platform-tools).
pinocchio = { version = "0.10.2", features = ["cpi", "copy"] }
pinocchio-log = "0.5.1"
# Pinned so `cargo update` cannot drift it to a version needing rustc 1.89.
solana-address = "=2.1.0"

[profile.release]
overflow-checks = true
lto = "fat"
opt-level = 3

[workspace]
