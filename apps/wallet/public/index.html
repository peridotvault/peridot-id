<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>PeridotID Wallet</title>
    <!-- Pre-JS paint: dark page background so first open never flashes white. -->
    <style>
      html {
        background: #0a0a0a;
      }
      /* Static splash: mirrors LoadingScreen (fontsReady=false) so the
         handoff to React is seamless — same 40px system-serif wordmark,
         replaced on mount with zero layout shift. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #fafafa;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 40px;
        font-weight: 400;
      }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!-- Removed on React mount (same element React renders into). -->
    <div id="splash">PeridotID</div>
  </body>
</html>
