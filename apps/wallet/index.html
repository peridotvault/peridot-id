<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>PeridotID Wallet</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%2328c840'/%3E%3C/svg%3E" />
    <!-- Pre-JS paint: dark page background so first open never flashes white. -->
    <style>
      html {
        background: #0a0a0a;
      }
      /* Static splash: mirrors LoadingScreen (fontsReady=false) so the
         handoff to React is seamless — same 40px system-serif wordmark,
         replaced on mount with zero layout shift. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #fafafa;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 40px;
        font-weight: 400;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Removed on React mount by useStartupGate. -->
    <div id="splash">PeridotID</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
