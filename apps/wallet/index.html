<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0d0f0e" />
    <!-- ANT-346 M2/H1: never leak ?pid_code= URLs to third parties via Referer.
         Nginx also sends Referrer-Policy; this meta is the fallback. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>PeridotID Wallet</title>
    <meta name="description" content="PeridotID Wallet — non-custodial Solana smart wallet with passkey sign-in. Send, receive, swap, and top up your Rupiah balance." />
    <link rel="icon" href="/logo/logo.png" />
    <!-- Pre-JS paint: dark page background so first open never flashes white. -->
    <style>
      html {
        background: #0d0f0e;
      }
      /* Static splash: mirrors LoadingScreen (fontsReady=false) so the handoff
         to React is seamless — same horizontal logo, size pinned so there is
         no layout shift. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0f0e;
      }
      #splash img {
        width: 113px;
        height: 64px;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Removed on React mount by useStartupGate. -->
    <div id="splash"><img src="/logo/logo-text.svg" alt="PeridotID" width="113" height="64" /></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
