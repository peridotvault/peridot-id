[package]
name = "peridot_id_mcp"
version = "0.1.0"
edition = "2021"
description = "PeridotID Developer MCP Server (Phase 2): Rust ICP canister exposing four read-only MCP tools (search_docs, get_integration_guide, get_example, get_sdk_reference) over a Mintlify-sourced generated index, Streamable HTTP JSON response mode."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.20.3"
ic-http-certification = "4.0.1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
